<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Amministratore</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    .box { background: white; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:disabled { background: #ccc; }
    .hidden { display: none; }
    .msg { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .msg.success { background: #d4edda; color: #155724; }
    .msg.error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <!-- LOGIN GITHUB -->
  <div id="login-box" class="box">
    <h2>Accesso Admin</h2>
    <div class="field">
      <label>GitHub Username:</label>
      <input type="text" id="gh-user" placeholder="es. MarioRossi">
    </div>
    <div class="field">
      <label>Nome Repository:</label>
      <input type="text" id="gh-repo" placeholder="es. mio-sito">
    </div>
    <div class="field">
      <label>GitHub Personal Access Token:</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    <button onclick="saveCredentials()">Accedi</button>
  </div>

  <!-- PANNELLO INSERIMENTO -->
  <div id="admin-panel" class="box hidden">
    <h2>Inserisci Prodotto</h2>
    
    <div class="field">
      <label>Nome Prodotto:</label>
      <input type="text" id="title" placeholder="Es. Workstation PC">
    </div>

    <div class="field">
      <label>Categoria:</label>
      <select id="category">
        <option value="desktop">PC-Desktop</option>
        <option value="notebook">Notebook</option>
        <option value="accessori">Accessori</option>
      </select>
    </div>

    <div class="field">
      <label>Descrizione:</label>
      <textarea id="desc" rows="4" placeholder="Inserisci la descrizione completa..."></textarea>
    </div>

    <div class="field">
      <label>File Scheda Tecnica (PDF):</label>
      <input type="file" id="pdf-file" accept="application/pdf">
    </div>

    <button id="btn-submit" onclick="uploadProduct()">Pubblica Prodotto</button>
    <div id="status-msg" class="msg"></div>
    <br><br>
    <a href="#" onclick="logout()" style="color: #666; font-size: 12px;">Disconnetti</a>
  </div>

  <script>
    let config = { user: '', repo: '', token: '' };

    window.onload = function() {
      const saved = localStorage.getItem('gh_admin_cfg');
      if (saved) {
        config = JSON.parse(saved);
        showPanel();
      }
    };

    function saveCredentials() {
      config.user = document.getElementById('gh-user').value.trim();
      config.repo = document.getElementById('gh-repo').value.trim();
      config.token = document.getElementById('gh-token').value.trim();

      if (!config.user || !config.repo || !config.token) {
        alert("Compila tutti i campi di accesso!");
        return;
      }
      localStorage.setItem('gh_admin_cfg', JSON.stringify(config));
      showPanel();
    }

    function logout() {
      localStorage.removeItem('gh_admin_cfg');
      location.reload();
    }

    function showPanel() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
    }

    function showMsg(text, isError = false) {
      const msg = document.getElementById('status-msg');
      msg.className = 'msg ' + (isError ? 'error' : 'success');
      msg.innerText = text;
      msg.style.display = 'block';
    }

    async function uploadProduct() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const desc = document.getElementById('desc').value;
      const fileInput = document.getElementById('pdf-file');
      const btn = document.getElementById('btn-submit');

      if (!title || !desc || fileInput.files.length === 0) {
        showMsg("Compila tutti i campi e seleziona un file PDF.", true);
        return;
      }

      const file = fileInput.files[0];
      const cleanFileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
      const pdfPath = `pdf/${cleanFileName}`;

      btn.disabled = true;
      showMsg("Caricamento PDF in corso...");

      try {
        // 1. Carica il file PDF su GitHub
        const pdfBase64 = await toBase64(file);
        await githubApiPut(pdfPath, pdfBase64, `Upload PDF: ${cleanFileName}`);

        showMsg("Aggiornamento catalogo prodotti...");

        // 2. Recupera prodotti.json o ne crea uno nuovo
        let catalog = { items: [] };
        let sha = null;

        try {
          const res = await githubApiGet('prodotti.json');
          sha = res.sha;
          catalog = JSON.parse(atob(res.content));
        } catch (e) {
          console.log("File prodotti.json non ancora esistente, creazione in corso.");
        }

        // 3. Aggiunge il nuovo prodotto
        catalog.items.push({
          title: title,
          category: category,
          desc: desc,
          pdf: pdfPath
        });

        // 4. Salva prodotti.json su GitHub
        const jsonContent = btoa(unescape(encodeURIComponent(JSON.stringify(catalog, null, 2))));
        await githubApiPut('prodotti.json', jsonContent, `Aggiunto prodotto: ${title}`, sha);

        showMsg("Prodotto e PDF pubblicati con successo!");
        document.getElementById('title').value = '';
        document.getElementById('desc').value = '';
        fileInput.value = '';

      } catch (err) {
        showMsg("Errore durante il salvataggio: " + err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function githubApiGet(path) {
      const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
      const res = await fetch(url, {
        headers: { 'Authorization': `token ${config.token}` }
      });
      if (!res.ok) throw new Error("Impossibile leggere " + path);
      return await res.json();
    }

    async function githubApiPut(path, contentBase64, message, sha = null) {
      const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
      const body = { message, content: contentBase64 };
      if (sha) body.sha = sha;

      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${config.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error("Errore durante la scrittura di " + path);
      return await res.json();
    }
  </script>
</body>
</html>
