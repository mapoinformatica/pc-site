<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Amministrazione</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; line-height: 1.5; background-color: #f8f9fa; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="number"], select, textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; }
    #status { margin-top: 16px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #e6fffa; color: #047857; border: 1px solid #a7f3d0; }
    .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .hidden { display: none; }

    /* Box calcolo prezzi dinamico */
    .price-calc-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .price-calc-box p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #166534;
      display: flex;
      justify-content: space-between;
    }
    .price-calc-box .total-row {
      font-weight: bold;
      border-top: 1px solid #bbf7d0;
      padding-top: 4px;
      margin-top: 4px;
      color: #14532d;
    }

    /* Stili per la lista */
    .product-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    .product-list-item:last-child { border-bottom: none; }
    .product-actions { display: flex; gap: 6px; }
    .btn-delete {
      background: #dc2626;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-delete:hover { background: #b91c1c; }
    .btn-edit {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-edit:hover { background: #0369a1; }
    .btn-cancel {
      background: #64748b;
      margin-top: 8px;
    }
    .btn-cancel:hover { background: #475569; }
    .badge {
      background: #e2e8f0;
      color: #475569;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 6px;
    }
    .logout-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-logout {
      background: #64748b;
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .btn-logout:hover { background: #475569; }
  </style>
</head>
<body>

  <!-- LOGIN CARD -->
  <div class="card" id="loginCard">
    <h2>Accesso Admin</h2>
    <div class="form-group">
      <label for="loginUser">Nome Utente GitHub</label>
      <input type="text" id="loginUser" placeholder="es. mapoinformatica">
    </div>
    <div class="form-group">
      <label for="loginPass">Personal Access Token (Password)</label>
      <input type="password" id="loginPass" placeholder="Incolla qui il tuo token ghp_...">
    </div>
    <button onclick="effettuaLogin()">Accedi</button>
    <div id="loginError" class="error hidden" style="margin-top: 12px;"></div>
  </div>

  <!-- ADMIN CARD -->
  <div class="card hidden" id="adminCard">
    <div class="logout-bar">
      <h2 id="formTitle">Pubblica Nuovo Prodotto</h2>
      <button class="btn-logout" onclick="eseguiLogout()">Esci</button>
    </div>
    <form id="productForm" onsubmit="salvaProdotto(event)">
      <input type="hidden" id="editIndex" value="">
      <div class="form-group">
        <label for="nome">Nome Prodotto</label>
        <input type="text" id="nome" required>
      </div>
      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="desktop">PC Desktop</option>
          <option value="notebook">Notebook</option>
          <option value="accessori">Accessori</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="cpu">CPU</label>
        <input type="text" id="cpu" placeholder="es. Intel Core i7-13700H">
      </div>
      <div class="form-group">
        <label for="ram">RAM</label>
        <input type="text" id="ram" placeholder="es. 16GB DDR5">
      </div>
      <div class="form-group">
        <label for="disco">Disco</label>
        <input type="text" id="disco" placeholder="es. 512GB SSD NVMe">
      </div>

      <!-- SEZIONE PREZZI -->
      <div class="form-group">
        <label for="prezzo">Prezzo Imponibile (€ senza IVA)</label>
        <input type="number" id="prezzo" step="0.01" min="0" placeholder="es. 850.00" oninput="aggiornaCalcoloPrezzo()" required>
      </div>

      <div class="price-calc-box">
        <p><span>Aliquota IVA fissa:</span> <strong>22%</strong></p>
        <p><span>IVA calcolata:</span> <strong id="valoreIva">€ 0.00</strong></p>
        <p class="total-row"><span>Prezzo Totale Ivato:</span> <strong id="valoreIvato">€ 0.00</strong></p>
      </div>

      <div class="form-group">
        <label for="descrizione">Descrizione</label>
        <textarea id="descrizione" rows="4" required></textarea>
      </div>
      <div class="form-group">
        <label for="immagine">Immagine Prodotto (JPG, PNG, WEBP)</label>
        <input type="file" id="immagine" accept="image/*">
        <small id="imgHelp" style="color: #666; display:none; margin-top:4px;"></small>
      </div>
      <div class="form-group">
        <label for="pdf">Scheda Tecnica PDF</label>
        <input type="file" id="pdf" accept="application/pdf">
        <small id="pdfHelp" style="color: #666; display:none; margin-top:4px;"></small>
      </div>
      <button type="submit" id="submitBtn">Pubblica Prodotto</button>
      <button type="button" id="cancelEditBtn" class="btn-cancel hidden" onclick="annullaModifica()">Annulla Modifica</button>
    </form>
    <div id="status"></div>
  </div>

  <!-- LISTA PRODOTTI -->
  <div class="card hidden" id="listCard">
    <h2>Gestisci / Elimina Prodotti</h2>
    <div id="listaProdotti">Caricamento prodotti...</div>
  </div>

  <script>
    const REPO_NAME = "pc-site";
    let prodottiGlobali = [];

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("admin_logged") === "true") {
        mostraPannello();
      }
    });

    function aggiornaCalcoloPrezzo() {
      const inputVal = parseFloat(document.getElementById("prezzo").value);
      const ivaElement = document.getElementById("valoreIva");
      const ivatoElement = document.getElementById("valoreIvato");

      if (isNaN(inputVal) || inputVal < 0) {
        ivaElement.textContent = "€ 0.00";
        ivatoElement.textContent = "€ 0.00";
        return;
      }

      const iva = inputVal * 0.22;
      const ivato = inputVal + iva;

      ivaElement.textContent = `€ ${iva.toFixed(2)}`;
      ivatoElement.textContent = `€ ${ivato.toFixed(2)}`;
    }

    async function effettuaLogin() {
      const uInput = document.getElementById("loginUser").value.trim();
      const tokenInput = document.getElementById("loginPass").value.trim();
      const errorDiv = document.getElementById("loginError");

      if (!uInput || !tokenInput) {
        errorDiv.textContent = "Inserisci sia lo username che il token!";
        errorDiv.classList.remove("hidden");
        return;
      }

      errorDiv.textContent = "Verifica credenziali in corso...";
      errorDiv.className = "error";
      errorDiv.classList.remove("hidden");

      try {
        const testRes = await fetch(`https://api.github.com/repos/${uInput}/${REPO_NAME}`, {
          headers: { "Authorization": `token ${tokenInput}` }
        });

        if (!testRes.ok) {
          throw new Error("Token o username non validi / non autorizzati.");
        }

        errorDiv.classList.add("hidden");
        localStorage.setItem("admin_logged", "true");
        localStorage.setItem("gh_user", uInput);
        localStorage.setItem("gh_repo", REPO_NAME);
        localStorage.setItem("gh_token", tokenInput);

        mostraPannello();

      } catch (err) {
        errorDiv.textContent = "Accesso negato: controlla che lo username e il token siano corretti.";
        errorDiv.classList.remove("hidden");
      }
    }

    function eseguiLogout() {
      localStorage.removeItem("admin_logged");
      localStorage.removeItem("gh_user");
      localStorage.removeItem("gh_repo");
      localStorage.removeItem("gh_token");
      
      document.getElementById("adminCard").classList.add("hidden");
      document.getElementById("listCard").classList.add("hidden");
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("loginUser").value = "";
      document.getElementById("loginPass").value = "";
    }

    function mostraPannello() {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("adminCard").classList.remove("hidden");
      document.getElementById("listCard").classList.remove("hidden");
      caricaListaProdotti();
    }

    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function caricaFileGitHub(path, contentBase64, message) {
      const user = localStorage.getItem("gh_user");
      const repo = localStorage.getItem("gh_repo");
      const token = localStorage.getItem("gh_token");
      const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;

      let sha = null;
      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          sha = data.sha;
        }
      } catch (e) {}

      const body = { message, content: contentBase64 };
      if (sha) body.sha = sha;

      const response = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(`Errore caricamento ${path}: ${errData.message || response.statusText}`);
      }
      return await response.json();
    }

    async function eliminaFileGitHub(path, message) {
      if (!path || path === '#' || path.startsWith('http')) return;

      const user = localStorage.getItem("gh_user");
      const repo = localStorage.getItem("gh_repo");
      const token = localStorage.getItem("gh_token");
      const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;

      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (!res.ok) return;

        const data = await res.json();
        const sha = data.sha;

        await fetch(url, {
          method: "DELETE",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message, sha })
        });
      } catch (err) {
        console.warn(`Impossibile eliminare il file ${path}:`, err);
      }
    }

    async function caricaListaProdotti() {
      const container = document.getElementById("listaProdotti");
      const user = localStorage.getItem("gh_user");
      const repo = localStorage.getItem("gh_repo");
      const token = localStorage.getItem("gh_token");

      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/prodotti.json?ref=main`, {
          headers: { "Authorization": `token ${token}` }
        });

        if (!res.ok) {
          container.textContent = "Nessun prodotto trovato.";
          return;
        }

        const data = await res.json();
        const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        prodottiGlobali = Array.isArray(content) ? content : (content.items || []);

        renderizzaTabella();

      } catch (e) {
        container.textContent = "Errore durante il caricamento della lista prodotti.";
      }
    }

    function renderizzaTabella() {
      const container = document.getElementById("listaProdotti");

      if (prodottiGlobali.length === 0) {
        container.textContent = "Nessun prodotto presente nel catalogo.";
        return;
      }

      container.innerHTML = prodottiGlobali.map((p, index) => {
        const title = p.nome || p.title || "Senza titolo";
        const cat = p.categoria || p.category || "";
        const prezzoDisplay = (p.prezzo !== undefined) ? ` - € ${parseFloat(p.prezzo).toFixed(2)}` : "";
        return `
          <div class="product-list-item">
            <div>
              <strong>${title}</strong>${prezzoDisplay}
              <span class="badge">${cat}</span>
            </div>
            <div class="product-actions">
              <button class="btn-edit" onclick="preparaModifica(${index})">Modifica</button>
              <button class="btn-delete" onclick="eliminaProdotto(${index})">Elimina</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function preparaModifica(index) {
      const p = prodottiGlobali[index];
      document.getElementById("editIndex").value = index;
      document.getElementById("nome").value = p.nome || "";
      document.getElementById("categoria").value = p.categoria || "desktop";
      document.getElementById("cpu").value = p.cpu || "";
      document.getElementById("ram").value = p.ram || "";
      document.getElementById("disco").value = p.disco || "";
      document.getElementById("prezzo").value = p.prezzo || p.price || "";
      document.getElementById("descrizione").value = p.descrizione || "";
      
      aggiornaCalcoloPrezzo();

      document.getElementById("immagine").required = false;
      document.getElementById("pdf").required = false;

      const imgHelp = document.getElementById("imgHelp");
      imgHelp.style.display = "block";
      imgHelp.textContent = `File attuale: ${p.immagine || 'Nessuno'} (lascia vuoto per non modificarlo)`;

      const pdfHelp = document.getElementById("pdfHelp");
      pdfHelp.style.display = "block";
      pdfHelp.textContent = `File attuale: ${p.pdf || 'Nessuno'} (lascia vuoto per non modificarlo)`;

      document.getElementById("formTitle").textContent = "Modifica Prodotto";
      document.getElementById("submitBtn").textContent = "Salva Modifiche";
      document.getElementById("cancelEditBtn").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function annullaModifica() {
      document.getElementById("productForm").reset();
      document.getElementById("editIndex").value = "";
      document.getElementById("valoreIva").textContent = "€ 0.00";
      document.getElementById("valoreIvato").textContent = "€ 0.00";
      document.getElementById("immagine").required = true;
      document.getElementById("pdf").required = true;
      document.getElementById("imgHelp").style.display = "none";
      document.getElementById("pdfHelp").style.display = "none";
      document.getElementById("formTitle").textContent = "Pubblica Nuovo Prodotto";
      document.getElementById("submitBtn").textContent = "Pubblica Prodotto";
      document.getElementById("cancelEditBtn").classList.add("hidden");
    }

    async function salvaProdotto(e) {
      e.preventDefault();
      const status = document.getElementById("status");
      const btn = document.getElementById("submitBtn");
      const editIndex = document.getElementById("editIndex").value;
      const isEditing = editIndex !== "";

      status.className = "";
      status.style.display = "block";
      status.textContent = isEditing ? "Aggiornamento in corso..." : "Caricamento file in corso...";
      btn.disabled = true;

      try {
        const nome = document.getElementById("nome").value.trim();
        const categoria = document.getElementById("categoria").value;
        const cpu = document.getElementById("cpu").value.trim();
        const ram = document.getElementById("ram").value.trim();
        const disco = document.getElementById("disco").value.trim();
        const prezzo = parseFloat(document.getElementById("prezzo").value);
        const descrizione = document.getElementById("descrizione").value.trim();
        const filePdf = document.getElementById("pdf").files[0];
        const fileImg = document.getElementById("immagine").files[0];

        let imgPath, pdfPath, timestamp, existingProd = null;

        if (isEditing) {
          existingProd = prodottiGlobali[editIndex];
          timestamp = existingProd.id || Date.now();
          imgPath = existingProd.immagine || existingProd.img;
          pdfPath = existingProd.pdf;

          if (fileImg) {
            imgPath = `img/${timestamp}_${fileImg.name.replace(/\s+/g, '_')}`;
            await caricaFileGitHub(imgPath, await fileToBase64(fileImg), `Aggiornata immagine: ${fileImg.name}`);
            if (existingProd.immagine && existingProd.immagine !== imgPath) {
              await eliminaFileGitHub(existingProd.immagine, "Rimosso vecchio file immagine");
            }
          }

          if (filePdf) {
            pdfPath = `pdf/${timestamp}_${filePdf.name.replace(/\s+/g, '_')}`;
            await caricaFileGitHub(pdfPath, await fileToBase64(filePdf), `Aggiornato PDF: ${filePdf.name}`);
            if (existingProd.pdf && existingProd.pdf !== pdfPath) {
              await eliminaFileGitHub(existingProd.pdf, "Rimosso vecchio file PDF");
            }
          }

          prodottiGlobali[editIndex] = {
            id: timestamp,
            nome,
            categoria,
            cpu,
            ram,
            disco,
            prezzo,
            descrizione,
            immagine: imgPath,
            pdf: pdfPath
          };

        } else {
          timestamp = Date.now();
          pdfPath = `pdf/${timestamp}_${filePdf.name.replace(/\s+/g, '_')}`;
          imgPath = `img/${timestamp}_${fileImg.name.replace(/\s+/g, '_')}`;

          await caricaFileGitHub(imgPath, await fileToBase64(fileImg), `Upload Immagine: ${fileImg.name}`);
          await caricaFileGitHub(pdfPath, await fileToBase64(filePdf), `Upload PDF: ${filePdf.name}`);

          const newUserProd = {
            id: timestamp,
            nome,
            categoria,
            cpu,
            ram,
            disco,
            prezzo,
            descrizione,
            immagine: imgPath,
            pdf: pdfPath
          };

          prodottiGlobali.push(newUserProd);
        }

        renderizzaTabella();

        const jsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(prodottiGlobali, null, 2))));
        const commitMsg = isEditing ? `Aggiornato prodotto: ${nome}` : `Aggiunto prodotto: ${nome}`;
        await caricaFileGitHub("prodotti.json", jsonBase64, commitMsg);

        status.className = "success";
        status.textContent = isEditing ? "Prodotto modificato con successo!" : "Prodotto pubblicato con successo!";
        
        annullaModifica();

      } catch (err) {
        status.className = "error";
        status.textContent = "Errore durante il salvataggio: " + err.message;
        caricaListaProdotti();
      } finally {
        btn.disabled = false;
      }
    }

    async function eliminaProdotto(index) {
      if (!confirm("Sei sicuro di voler eliminare questo prodotto e i relativi file (immagine e PDF)?")) return;

      try {
        const prodottoDaEliminare = prodottiGlobali[index];

        if (prodottoDaEliminare) {
          const imgPath = prodottoDaEliminare.immagine || prodottoDaEliminare.img;
          const pdfPath = prodottoDaEliminare.pdf;

          if (imgPath) {
            await eliminaFileGitHub(imgPath, `Eliminata immagine per prodotto: ${prodottoDaEliminare.nome || prodottoDaEliminare.title}`);
          }
          if (pdfPath) {
            await eliminaFileGitHub(pdfPath, `Eliminato PDF per prodotto: ${prodottoDaEliminare.nome || prodottoDaEliminare.title}`);
          }
        }

        prodottiGlobali.splice(index, 1);
        renderizzaTabella();

        const jsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(prodottiGlobali, null, 2))));
        await caricaFileGitHub("prodotti.json", jsonBase64, `Rimosso prodotto in posizione ${index}`);

      } catch (err) {
        alert("Errore durante l'eliminazione: " + err.message);
        caricaListaProdotti();
      }
    }
  </script>
</body>
</html>
