<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Amministrazione</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input[type="text"], select, textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    button:hover { background: #0052a3; }
    #status { margin-top: 16px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #e6fffa; color: #047857; border: 1px solid #a7f3d0; }
    .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card" id="loginCard">
    <h2>Accesso Admin</h2>
    <div class="form-group">
      <label for="username">GitHub Username</label>
      <input type="text" id="username" placeholder="es. mapoinformatica">
    </div>
    <div class="form-group">
      <label for="repo">Nome Repository</label>
      <input type="text" id="repo" placeholder="es. catalogo-prodotti">
    </div>
    <div class="form-group">
      <label for="token">Personal Access Token (ghp_...)</label>
      <input type="text" id="token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    <button onclick="salvaCredenziali()">Accedi</button>
  </div>

  <div class="card hidden" id="adminCard">
    <h2>Pubblica Nuovo Prodotto</h2>
    <form id="productForm" onsubmit="pubblicaProdotto(event)">
      <div class="form-group">
        <label for="nome">Nome Prodotto</label>
        <input type="text" id="nome" required>
      </div>
      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="desktop">PC Desktop</option>
          <option value="notebook">Notebook</option>
          <option value="accessori">Accessori</option>
        </select>
      </div>
      <div class="form-group">
        <label for="descrizione">Descrizione</label>
        <textarea id="descrizione" rows="4" required></textarea>
      </div>
      <div class="form-group">
        <label for="immagine">Immagine Prodotto (JPG, PNG, WEBP)</label>
        <input type="file" id="immagine" accept="image/*" required>
      </div>
      <div class="form-group">
        <label for="pdf">Scheda Tecnica PDF</label>
        <input type="file" id="pdf" accept="application/pdf" required>
      </div>
      <button type="submit" id="submitBtn">Pubblica Prodotto</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("gh_token")) {
        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("adminCard").classList.remove("hidden");
      }
    });

    function salvaCredenziali() {
      const u = document.getElementById("username").value.trim();
      const r = document.getElementById("repo").value.trim();
      const t = document.getElementById("token").value.trim();

      if (!u || !r || !t) return alert("Compila tutti i campi!");

      localStorage.setItem("gh_user", u);
      localStorage.setItem("gh_repo", r);
      localStorage.setItem("gh_token", t);

      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("adminCard").classList.remove("hidden");
    }

    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function caricaFileGitHub(path, contentBase64, message) {
      const user = localStorage.getItem("gh_user");
      const repo = localStorage.getItem("gh_repo");
      const token = localStorage.getItem("gh_token");
      const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;

      let sha = null;
      try {
        const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (res.ok) {
          const data = await res.json();
          sha = data.sha;
        }
      } catch (e) {}

      const body = { message, content: contentBase64 };
      if (sha) body.sha = sha;

      const response = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) throw new Error(`Errore caricamento ${path}`);
      return await response.json();
    }

    async function pubblicaProdotto(e) {
      e.preventDefault();
      const status = document.getElementById("status");
      const btn = document.getElementById("submitBtn");

      status.className = "";
      status.style.display = "block";
      status.textContent = "Caricamento file in corso...";
      btn.disabled = true;

      try {
        const user = localStorage.getItem("gh_user");
        const repo = localStorage.getItem("gh_repo");
        const token = localStorage.getItem("gh_token");

        const nome = document.getElementById("nome").value.trim();
        const categoria = document.getElementById("categoria").value;
        const descrizione = document.getElementById("descrizione").value.trim();
        const filePdf = document.getElementById("pdf").files[0];
        const fileImg = document.getElementById("immagine").files[0];

        const timestamp = Date.now();
        const pdfPath = `pdf/${timestamp}_${filePdf.name.replace(/\s+/g, '_')}`;
        const imgPath = `img/${timestamp}_${fileImg.name.replace(/\s+/g, '_')}`;

        // 1. Carica Immagine
        const imgBase64 = await fileToBase64(fileImg);
        await caricaFileGitHub(imgPath, imgBase64, `Upload Immagine: ${fileImg.name}`);

        // 2. Carica PDF
        const pdfBase64 = await fileToBase64(filePdf);
        await caricaFileGitHub(pdfPath, pdfBase64, `Upload PDF: ${filePdf.name}`);

        // 3. Scarica o inizializza prodotti.json
        let prodotti = [];
        let jsonSha = null;
        const jsonUrl = `https://api.github.com/repos/${user}/${repo}/contents/prodotti.json`;

        try {
          const res = await fetch(jsonUrl, { headers: { "Authorization": `token ${token}` } });
          if (res.ok) {
            const data = await res.json();
            jsonSha = data.sha;
            prodotti = JSON.parse(atob(data.content));
          }
        } catch (e) {}

        // 4. Aggiungi nuovo prodotto
        prodotti.push({
          id: timestamp,
          nome,
          categoria,
          descrizione,
          immagine: imgPath,
          pdf: pdfPath
        });

        // 5. Salva prodotti.json aggiornato
        const jsonBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(prodotti, null, 2))));
        await caricaFileGitHub("prodotti.json", jsonBase64, `Aggiunto prodotto: ${nome}`);

        status.className = "success";
        status.textContent = "Prodotto pubblicato con successo!";
        document.getElementById("productForm").reset();

      } catch (err) {
        status.className = "error";
        status.textContent = "Errore durante la pubblicazione: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
