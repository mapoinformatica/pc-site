<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="container">
      <h1>Catalogo Prodotti</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="desktop.html">PC-Desktop</a>
        <a href="notebook.html" class="active">Notebook</a>
        <a href="accessori.html">Accessori</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <h2>Prodotti Notebook</h2>
    <div id="products-grid" class="products-grid">
      <p>Caricamento prodotti...</p>
    </div>
  </main>

  <script>
    const currentCategory = 'notebook';

    fetch('prodotti.json?cache=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('products-grid');
        const items = (data.items || []).filter(p => p.category === currentCategory);

        if (items.length === 0) {
          grid.innerHTML = '<p>Nessun prodotto disponibile.</p>';
          return;
        }

        grid.innerHTML = items.map(p => `
          <div class="product-card">
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
            <a href="${p.pdf}" target="_blank" download class="btn-download">Scarica Scheda Tecnica (PDF)</a>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('products-grid').innerHTML = '<p>Nessun prodotto ancora inserito.</p>';
      });
  </script>
</body>
</html>
