<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC-Desktop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Rimuove il vincolo quadrato e adatta l'altezza in base al contenuto */
    .product-card {
      aspect-ratio: auto !important;
      height: auto !important;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    .product-img-container {
      width: 100%;
      height: 180px;
      margin-bottom: 10px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      margin: 0 0 6px 0;
      font-size: 1rem;
      color: #1e293b;
      flex-shrink: 0;
    }

    .product-specs {
      font-size: 0.8rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .product-specs div {
      margin-bottom: 2px;
      color: #334155;
    }

    .product-specs div:last-child {
      margin-bottom: 0;
    }

    /* Stile per la sezione prezzi */
    .product-pricing {
      font-size: 0.8rem;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .product-pricing div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
      color: #166534;
    }

    .product-pricing div.total-price {
      font-weight: bold;
      border-top: 1px solid #bbf7d0;
      padding-top: 3px;
      margin-top: 3px;
      color: #14532d;
    }

    .product-desc {
      font-size: 0.82rem !important;
      color: #475569 !important;
      line-height: 1.5;
      max-height: 90px;
      overflow-y: auto !important;
      flex-grow: 1;
      margin: 0 0 10px 0 !important;
    }

    .btn-download {
      flex-shrink: 0;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="container">
      <img src="logo/LOGO_MAPO_2016.gif" alt="Logo Mapo Informatica" class="header-logo">
      <h1>Catalogo Prodotti</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="desktop.html" class="active">PC-Desktop</a>
        <a href="notebook.html">Notebook</a>
        <a href="accessori.html">Accessori</a>
        <a href="contatti.html">Contatti</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <h2>Prodotti PC-Desktop</h2>
    <div id="products-grid" class="products-grid">
      <p>Caricamento prodotti...</p>
    </div>
  </main>

  <script>
    const currentCategory = 'desktop';
    const timestamp = new Date();
    fetch(`prodotti.json?t=${timestamp}`)
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('products-grid');
        const allItems = Array.isArray(data) ? data : (data.items || []);
        const items = allItems.filter(p => p.categoria === currentCategory || p.category === currentCategory);

        if (items.length === 0)  {
          grid.innerHTML = '<p>Nessun prodotto disponibile in questa categoria.</p>';
          return;
        }

        grid.innerHTML = items.map(p => {
          const title = p.nome || p.title || 'Prodotto senza titolo';
          const desc = p.descrizione || p.desc || '';
          const pdfPath = p.pdf || '#';
          const imgPath = p.immagine || p.img || '';

          const cpu = p.cpu || '';
          const ram = p.ram || '';
          const disco = p.disco || '';

          // Gestione Prezzi (supporta diverse varianti di chiavi nel JSON)
          const rawPrice = p.prezzo || p.price || p.prezzo_imponibile || p.imponibile;
          let pricingHtml = '';

          if (rawPrice !== undefined && rawPrice !== null && rawPrice !== '') {
            const imponibile = parseFloat(rawPrice);
            if (!isNaN(imponibile)) {
              const iva = imponibile * 0.22;
              const ivato = imponibile + iva;

              pricingHtml = `
                <div class="product-pricing">
                  <div><span>Imponibile (Escl. IVA):</span> <strong>€ ${imponibile.toFixed(2)}</strong></div>
                  <div><span>IVA (22%):</span> <strong>€ ${iva.toFixed(2)}</strong></div>
                  <div class="total-price"><span>Prezzo Ivato:</span> <strong>€ ${ivato.toFixed(2)}</strong></div>
                </div>
              `;
            }
          }

          const imageHtml = imgPath 
            ? `<div class="product-img-container"><img src="${imgPath}" alt="${title}" class="product-img" onerror="this.parentElement.style.display='none'"></div>`
            : `<div class="product-img-container"><span style="color:#94a3b8; font-size:12px;">Nessuna immagine</span></div>`;

          const specsHtml = (cpu || ram || disco) ? `
            <div class="product-specs">
              ${cpu ? `<div><strong>CPU:</strong> ${cpu}</div>` : ''}
              ${ram ? `<div><strong>RAM:</strong> ${ram}</div>` : ''}
              ${disco ? `<div><strong>Disco:</strong> ${disco}</div>` : ''}
            </div>
          ` : '';

          return `
            <div class="product-card">
              ${imageHtml}
              <div class="product-info">
                <h3 class="product-title">${title}</h3>
                ${specsHtml}
                ${pricingHtml}
                <p class="product-desc">${desc}</p>
              </div>
              <a href="${pdfPath}" target="_blank" download class="btn-download">Scarica Scheda Tecnica (PDF)</a>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        console.error(err);
        document.getElementById('products-grid').innerHTML = '<p>Nessun prodotto ancora inserito o file prodotti.json non trovato.</p>';
      });
  </script>

  <footer class="main-footer-legal">
  <div class="container footer-content">
    <p>&copy; 2026 Mapo Informatica - Tutti i diritti riservati.</p>
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="cookie.html">Cookie Policy</a>
    </div>
  </div>
</footer>

</body>
</html>
