<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC-Desktop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Struttura principale della scheda con altezza fissa */
    .product-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 460px;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    .product-img-container {
      width: 100%;
      height: 130px;
      margin-bottom: 10px;
      border-radius: 6px;
      overflow: hidden;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .product-title {
      margin: 0 0 6px 0;
      font-size: 1rem;
      color: #1e293b;
      flex-shrink: 0;
    }

    /* Stili per le specifiche tecniche (CPU, RAM, Disco) */
    .product-specs {
      font-size: 0.8rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .product-specs div {
      margin-bottom: 2px;
      color: #334155;
    }

    .product-specs div:last-child {
      margin-bottom: 0;
    }

    /* Sezione Descrizione con interlinea ampia e scrollbar verticale */
    .product-desc {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.6;
      margin: 0 0 10px 0;
      padding-right: 4px;
      overflow-y: auto;
      flex-grow: 1;
    }

    /* Pulsante ancorato in fondo */
    .btn-download {
      flex-shrink: 0;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="container">
      <h1>Catalogo Prodotti</h1>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="desktop.html" class="active">PC-Desktop</a>
        <a href="notebook.html">Notebook</a>
        <a href="accessori.html">Accessori</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <h2>Prodotti PC-Desktop</h2>
    <div id="products-grid" class="products-grid">
      <p>Caricamento prodotti...</p>
    </div>
  </main>

  <script>
    const currentCategory = 'desktop';

    fetch('prodotti.json?cache=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('products-grid');
        const allItems = Array.isArray(data) ? data : (data.items || []);
        const items = allItems.filter(p => p.categoria === currentCategory || p.category === currentCategory);

        if (items.length === 0) {
          grid.innerHTML = '<p>Nessun prodotto disponibile in questa categoria.</p>';
          return;
        }

        grid.innerHTML = items.map(p => {
          const title = p.nome || p.title || 'Prodotto senza titolo';
          const desc = p.descrizione || p.desc || '';
          const pdfPath = p.pdf || '#';
          const imgPath = p.immagine || p.img || '';

          const cpu = p.cpu || '';
          const ram = p.ram || '';
          const disco = p.disco || '';

          const imageHtml = imgPath 
            ? `<div class="product-img-container"><img src="${imgPath}" alt="${title}" class="product-img" onerror="this.parentElement.style.display='none'"></div>`
            : `<div class="product-img-container"><span style="color:#94a3b8; font-size:12px;">Nessuna immagine</span></div>`;

          const specsHtml = (cpu || ram || disco) ? `
            <div class="product-specs">
              ${cpu ? `<div><strong>CPU:</strong> ${cpu}</div>` : ''}
              ${ram ? `<div><strong>RAM:</strong> ${ram}</div>` : ''}
              ${disco ? `<div><strong>Disco:</strong> ${disco}</div>` : ''}
            </div>
          ` : '';

          return `
            <div class="product-card">
              ${imageHtml}
              <div class="product-info">
                <h3 class="product-title">${title}</h3>
                ${specsHtml}
                <p class="product-desc">${desc}</p>
              </div>
              <a href="${pdfPath}" target="_blank" download class="btn-download">Scarica Scheda Tecnica (PDF)</a>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        console.error(err);
        document.getElementById('products-grid').innerHTML = '<p>Nessun prodotto ancora inserito o file prodotti.json non trovato.</p>';
      });
  </script>
</body>
</html>
