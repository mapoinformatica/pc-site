<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Prodotti</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Header: Logo a Sinistra, Pulsanti a Destra -->
  <header class="header">
    <div class="container header-container">
      <div class="logo">
        <span class="logo-icon">💻</span>
        <span class="logo-text">NomeBrand</span>
      </div>
      <nav class="nav-buttons">
        <a href="#desktop" class="btn btn-primary">Pc-Desktop</a>
        <a href="#notebook" class="btn btn-primary">Notebook</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Consultazione Catologhi PDF</h1>
      <p>Seleziona una categoria per visualizzare i documenti dedicati.</p>
    </section>

    <!-- Sezione PC-Desktop -->
    <section id="desktop" class="pdf-wrapper">
      <div class="pdf-header">
        <h2>Sezione PC-Desktop</h2>
        <a href="documento.pdf" target="_blank" class="link-external">Apri PDF a schermo intero ↗</a>
      </div>
      <div class="pdf-frame-container">
        <iframe src="desktop.pdf#toolbar=1" class="pdf-frame">
          Il tuo browser non supporta i PDF. <a href="desktop.pdf">Scarica qui il file.</a>
        </iframe>
      </div>
    </section>

    <!-- Sezione Notebook -->
    <section id="notebook" class="pdf-wrapper">
      <div class="pdf-header">
        <h2>Sezione Notebook</h2>
        <a href="documento.pdf" target="_blank" class="link-external">Apri PDF a schermo intero ↗</a>
      </div>
      <div class="pdf-frame-container">
        <iframe src="notebook.pdf#toolbar=1" class="pdf-frame">
          Il tuo browser non supporta i PDF. <a href="notebook.pdf">Scarica qui il file.</a>
        </iframe>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Tutti i diritti riservati.</p>
    </div>
  </footer>

</body>
</html>
